# .github/workflows/publish.yml

name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.ref }}

jobs:
  publish:
    name: Release build and publish
    runs-on: macos-15
    steps:
      - name: Resolve version from release tag
        shell: bash
        run: |
          release_tag_pattern='^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)(\.(0|[1-9][0-9]*))?)?$'
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ $release_tag_pattern ]]; then
            echo '::error::Select a release-X.Y.Z tag, optionally with an alpha, beta, or rc suffix.'
            exit 1
          fi
          version=${GITHUB_REF_NAME#release-}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing Markdown $version from $GITHUB_REF_NAME"

      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Publish to MavenCentral
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache -PVERSION="$VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
