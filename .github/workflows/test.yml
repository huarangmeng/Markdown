name: Test

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

jobs:
  jvm-test:
    name: JVM Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Run parser JVM tests
        run: ./gradlew :markdown-parser:jvmTest

      - name: Run renderer JVM tests
        run: ./gradlew :markdown-renderer:jvmTest

      - name: Run runtime JVM tests
        run: ./gradlew :markdown-runtime:jvmTest